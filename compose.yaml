services:
  one-ip:
    build: .
    image: one-ip:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    env_file:
      - path: .env.docker
        required: false
    environment:
      PORT: 8080
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
